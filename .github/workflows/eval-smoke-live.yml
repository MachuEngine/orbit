# 실제 모델 스모크(수동 실행, 비용 발생). 결정적 스모크는 CI(backend/tests/integration/test_eval_smoke_ci.py)가
# 모든 PR에서 비용 없이 돈다. 이 워크플로는 workflow_dispatch로만 실행한다. 공개 저장소에서 포크 PR이
# 시크릿을 쓰지 못하도록 pull_request·push 트리거를 두지 않는다. (ADR-0026 §5)
name: Eval smoke (live model)

on:
  workflow_dispatch:
    inputs:
      sut:
        description: 평가 대상
        type: choice
        options: [runflow_v0, assistant_v0]
        default: runflow_v0
      model_id:
        description: 모델 ID (ORBIT_LLM_MODEL_ID와 같은 값, 예 provider/model)
        type: string
        required: true
      provider_order:
        description: 쉼표로 구분한 OpenRouter 제공자 우선순위 (ORBIT_LLM_PROVIDER_ORDER)
        type: string
        required: true
      max_cost_usd:
        description: 누적 비용 상한(달러)
        type: string
        default: "0.2"
      max_total_tokens:
        description: 누적 토큰 상한(단가를 주지 않아 비용이 미상일 때의 안전장치)
        type: string
        default: "1000000"
      price_input_per_mtok:
        description: 입력 단가(1M 토큰당 달러). 비우면 비용이 미상이 된다
        type: string
        default: ""
      price_cached_input_per_mtok:
        description: 캐시 입력 단가(1M 토큰당 달러)
        type: string
        default: ""
      price_output_per_mtok:
        description: 출력 단가(1M 토큰당 달러)
        type: string
        default: ""
      price_source:
        description: 단가 출처
        type: string
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_VERSION: 0.11.28
      # 평가 DB(runflow_v0)용 합성 비밀번호. 서비스 컨테이너는 이 job 안에서만 열린다.
      ORBIT_PG_SUPERUSER_PASSWORD: ci_superuser_pw
      ORBIT_OWNER_PASSWORD: ci_owner_pw
      ORBIT_APP_PASSWORD: ci_app_pw
      ORBIT_DATABASE_URL: postgresql+psycopg://orbit_app:ci_app_pw@localhost:5432/orbit
      ORBIT_MIGRATION_DATABASE_URL: postgresql+psycopg://orbit_owner:ci_owner_pw@localhost:5432/orbit_eval
      ORBIT_EVAL_DATABASE_URL: postgresql+psycopg://orbit_app:ci_app_pw@localhost:5432/orbit_eval
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: orbit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_superuser_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check API key secret
        env:
          KEY: ${{ secrets.ORBIT_OPENROUTER_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::저장소 시크릿 ORBIT_OPENROUTER_API_KEY가 없다. Settings > Secrets and variables > Actions에서 추가한 뒤 다시 실행한다."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync backend dependencies
        run: uv sync --directory backend --frozen

      - name: Create DB roles
        run: psql "postgresql://postgres@localhost:5432/orbit" -f backend/db/init/00_roles.sql
        env:
          PGPASSWORD: ${{ env.ORBIT_PG_SUPERUSER_PASSWORD }}

      - name: Migrate eval database
        run: uv run --directory backend alembic upgrade head

      - name: Run live smoke
        env:
          ORBIT_LLM_PROVIDER: openrouter
          ORBIT_OPENROUTER_API_KEY: ${{ secrets.ORBIT_OPENROUTER_API_KEY }}
          ORBIT_LLM_MODEL_ID: ${{ inputs.model_id }}
          ORBIT_LLM_PROVIDER_ORDER: ${{ inputs.provider_order }}
          ORBIT_LLM_PRICE_INPUT_PER_MTOK: ${{ inputs.price_input_per_mtok }}
          ORBIT_LLM_PRICE_CACHED_INPUT_PER_MTOK: ${{ inputs.price_cached_input_per_mtok }}
          ORBIT_LLM_PRICE_OUTPUT_PER_MTOK: ${{ inputs.price_output_per_mtok }}
          ORBIT_LLM_PRICE_SOURCE: ${{ inputs.price_source }}
          SUT: ${{ inputs.sut }}
          MODEL_ID: ${{ inputs.model_id }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
          MAX_TOTAL_TOKENS: ${{ inputs.max_total_tokens }}
        run: |
          mkdir -p runs/smoke-live
          set +e
          uv run --directory backend python -m orbit.evalrunner run \
            --dataset ../eval/datasets/orbit-eval/v1 --split dev --subset smoke \
            --sut "$SUT" --live-llm --model-id "$MODEL_ID" --repeats 1 --seed 0 \
            --max-cost-usd "$MAX_COST_USD" --max-total-tokens "$MAX_TOTAL_TOKENS" \
            --out ../runs/smoke-live/results.jsonl
          rc=$?
          set -e
          if [ -f runs/smoke-live/results.jsonl ]; then
            uv run --directory backend python -m orbit.evalrunner stats \
              ../runs/smoke-live/results.jsonl > runs/smoke-live/stats.json || true
          fi
          exit "$rc"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-live-${{ inputs.sut }}
          path: runs/smoke-live/
          if-no-files-found: warn
