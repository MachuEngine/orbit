<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit 로고 후보 미리보기 (후보, 개발자 선택 전)</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; margin: 24px; color: #17191C; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
  table { border-collapse: collapse; }
  th, td { padding: 12px 16px; border: 1px solid #DEE0E3; text-align: left; vertical-align: middle; }
  th[scope=row] { font-weight: 500; min-width: 14em; }
  td.light { background: #FFFFFF; }
  td.dark { background: #16181B; }
  img { display: block; }
</style>
</head>
<body>
<h1>Orbit 로고 후보 (후보 상태)</h1>
<p>같은 폴더의 SVG만 불러온다. 왼쪽 세 칸은 밝은 배경(64, 32, 16px), 오른쪽 세 칸은 어두운 배경이다.
워드마크는 <code>&lt;text&gt;</code> 초안이라 이 화면에서는 시스템 글꼴로 보인다. <code>&lt;img&gt;</code>로 불러온 SVG는 웹 글꼴을 쓰지 못한다.</p>
<table>
<thead><tr><th></th><th colspan="3">밝은 배경</th><th colspan="3">어두운 배경</th></tr>
<tr><th></th><th>64px</th><th>32px</th><th>16px</th><th>64px</th><th>32px</th><th>16px</th></tr></thead>
<tbody>
<tr><th scope="row">로고마크 A 게이트</th><td class="light"><img src="mark-gate.svg" height="64" width="64" alt=""></td><td class="light"><img src="mark-gate.svg" height="32" width="32" alt=""></td><td class="light"><img src="mark-gate.svg" height="16" width="16" alt=""></td><td class="dark"><img src="mark-gate-on-dark.svg" height="64" width="64" alt=""></td><td class="dark"><img src="mark-gate-on-dark.svg" height="32" width="32" alt=""></td><td class="dark"><img src="mark-gate-on-dark.svg" height="16" width="16" alt=""></td></tr>
<tr><th scope="row">로고마크 B 조각</th><td class="light"><img src="mark-slice.svg" height="64" width="64" alt=""></td><td class="light"><img src="mark-slice.svg" height="32" width="32" alt=""></td><td class="light"><img src="mark-slice.svg" height="16" width="16" alt=""></td><td class="dark"><img src="mark-slice-on-dark.svg" height="64" width="64" alt=""></td><td class="dark"><img src="mark-slice-on-dark.svg" height="32" width="32" alt=""></td><td class="dark"><img src="mark-slice-on-dark.svg" height="16" width="16" alt=""></td></tr>
<tr><th scope="row">로고마크 C 어긋난 O</th><td class="light"><img src="mark-shift.svg" height="64" width="64" alt=""></td><td class="light"><img src="mark-shift.svg" height="32" width="32" alt=""></td><td class="light"><img src="mark-shift.svg" height="16" width="16" alt=""></td><td class="dark"><img src="mark-shift-on-dark.svg" height="64" width="64" alt=""></td><td class="dark"><img src="mark-shift-on-dark.svg" height="32" width="32" alt=""></td><td class="dark"><img src="mark-shift-on-dark.svg" height="16" width="16" alt=""></td></tr>
<tr><th scope="row">워드마크 1 Orbit</th><td class="light"><img src="word-title.svg" height="64" alt=""></td><td class="light"><img src="word-title.svg" height="32" alt=""></td><td class="light"><img src="word-title.svg" height="16" alt=""></td><td class="dark"><img src="word-title-on-dark.svg" height="64" alt=""></td><td class="dark"><img src="word-title-on-dark.svg" height="32" alt=""></td><td class="dark"><img src="word-title-on-dark.svg" height="16" alt=""></td></tr>
<tr><th scope="row">워드마크 2 orbit</th><td class="light"><img src="word-lower.svg" height="64" alt=""></td><td class="light"><img src="word-lower.svg" height="32" alt=""></td><td class="light"><img src="word-lower.svg" height="16" alt=""></td><td class="dark"><img src="word-lower-on-dark.svg" height="64" alt=""></td><td class="dark"><img src="word-lower-on-dark.svg" height="32" alt=""></td><td class="dark"><img src="word-lower-on-dark.svg" height="16" alt=""></td></tr>
<tr><th scope="row">조합형 (게이트 + Orbit) (16px 칸은 기호만)</th><td class="light"><img src="combo-gate.svg" height="64" alt=""></td><td class="light"><img src="combo-gate.svg" height="32" alt=""></td><td class="light"><img src="mark-gate.svg" height="16" width="16" alt=""></td><td class="dark"><img src="combo-gate-on-dark.svg" height="64" alt=""></td><td class="dark"><img src="combo-gate-on-dark.svg" height="32" alt=""></td><td class="dark"><img src="mark-gate-on-dark.svg" height="16" width="16" alt=""></td></tr>
</tbody>
</table>
</body>
</html>
