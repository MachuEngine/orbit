# 테스트용 작은 세계 모델(합성). 실제 인물·회사·주소가 아니다. 구조는 eval/worlds/orbit-v1.toml과 같다.
[meta]
world_name = "orbit-world-test"
world_version = "t1"

[window]
snapshot = 2026-11-10T10:00:00+09:00
mail_weeks = 8
event_weeks_before = 8
event_weeks_after = 4
asof_start = 2026-11-10
asof_end = 2026-11-16

[generation]
families = ["openai", "anthropic", "google"]

[targets]
mails_per_e2e_user = 140
mails_tolerance = 10
docs_per_e2e_user = [10, 24]
search_docs = 6
search_sizes = [20, 60, 150]
background_events_per_user = 12
background_all_day_per_user = 1
length_mix = { short = 0.40, medium = 0.40, long = 0.20 }

[targets.scenarios]
day_agenda = 2
free_slot = 2
reschedule = 2
cancellation = 2
project_week = 2
person_next = 2
cross_midnight = 2
tz_event = 4
all_day = 2
mail_fact = 10
reply_needed = 2
meeting_request = 2
event_change_target = 2
doc_fact = 6
doc_version = 2
deadline = 4
mismatch = 2
absent = 8
ambiguous = 6
search_topic = 6

[targets.variants]
"absent.person_no_meeting" = 2
"absent.no_document" = 2
"absent.no_amount" = 2
"absent.project_no_meeting" = 2
"ambiguous.person_meetings" = 2
"ambiguous.same_project_notes" = 2
"ambiguous.homonym_person" = 2

