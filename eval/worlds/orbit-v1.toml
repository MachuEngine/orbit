# Orbit 평가 세계 모델 v1 (합성 데이터, ADR-0026). 실제 인물·회사·주소가 아니다.
# 모든 주소는 example.com / example.org / example.net / .test 도메인이다.
# 구조 생성기(orbit.evaldata.v1.build)가 읽는다. 본문(메일·문서 텍스트)은 이 파일에 없다.

[meta]
world_name = "orbit-world"
world_version = "v1"

[window]
snapshot = 2026-11-10T10:00:00+09:00   # 평일(화) 오전. 모든 메일·일정 갱신은 이 시각 이전이다
mail_weeks = 8                          # 메일: 스냅샷 이전 8주
event_weeks_before = 8                  # 일정: 스냅샷 8주 전부터
event_weeks_after = 4                   # 4주 후까지 (America/Los_Angeles의 2026-11-01 DST 종료가 기간 안)
asof_start = 2026-11-10                 # 과제 as_of: 사용자 현지 평일 날짜 범위(스냅샷 이후 1주 안)
asof_end = 2026-11-16

[generation]
families = ["openai", "anthropic", "google"]   # 본문 생성 계열(ADR-0026 §2.5)

[targets]
mails_per_e2e_user = 300
mails_tolerance = 15
docs_per_e2e_user = [20, 40]
search_docs = 24                        # 검색 사용자 세 명이 같은 문서 묶음을 가진다
search_sizes = [200, 1000, 5000]        # 검색 사용자 순서와 같다. 앞 메일함이 뒤 메일함의 부분집합이다
background_events_per_user = 40
background_all_day_per_user = 3
length_mix = { short = 0.40, medium = 0.40, long = 0.20 }

[targets.scenarios]
day_agenda = 12
free_slot = 12
reschedule = 12
cancellation = 12
project_week = 12
person_next = 12
cross_midnight = 6
tz_event = 12
all_day = 6
mail_fact = 120
reply_needed = 24
meeting_request = 18
event_change_target = 18
doc_fact = 24
doc_version = 24
deadline = 48
mismatch = 48
absent = 48
ambiguous = 42
search_topic = 60

[targets.variants]   # 유형 안의 갈래별 수. 합이 유형 수와 같아야 한다
"absent.person_no_meeting" = 12
"absent.no_document" = 18
"absent.no_amount" = 9
"absent.project_no_meeting" = 9
"ambiguous.person_meetings" = 18
"ambiguous.same_project_notes" = 12
"ambiguous.homonym_person" = 12

