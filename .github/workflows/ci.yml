name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.18.4
      UV_VERSION: 0.11.28
      # CI 전용 합성 비밀번호. 서비스 컨테이너는 이 job 안에서만 열린다.
      ORBIT_PG_SUPERUSER_PASSWORD: ci_superuser_pw
      ORBIT_OWNER_PASSWORD: ci_owner_pw
      ORBIT_APP_PASSWORD: ci_app_pw
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: orbit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_superuser_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 비밀정보 탐지가 전체 커밋 이력을 검사하도록

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 프로젝트 언어 런타임 설치 단계는 이 아래에 추가한다 (병합 파일).
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync backend dependencies
        run: uv sync --directory backend --frozen

      # 서비스 컨테이너에는 파일을 마운트할 수 없어 같은 init SQL을 psql로 실행한다.
      - name: Create DB roles
        run: psql "postgresql://postgres:ci_superuser_pw@localhost:5432/orbit" -f backend/db/init/00_roles.sql

      - name: Run migrations
        run: uv run --directory backend alembic upgrade head
        env:
          ORBIT_MIGRATION_DATABASE_URL: postgresql+psycopg://orbit_owner:ci_owner_pw@localhost:5432/orbit

      - name: Run checks
        run: bash scripts/check.sh
        env:
          CI: "true"
          ORBIT_DATABASE_URL: postgresql+psycopg://orbit_app:ci_app_pw@localhost:5432/orbit
          ORBIT_MIGRATION_DATABASE_URL: postgresql+psycopg://orbit_owner:ci_owner_pw@localhost:5432/orbit
          ORBIT_TEST_DATABASE_URL: postgresql+psycopg://orbit_app:ci_app_pw@localhost:5432/orbit_test
          ORBIT_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://orbit_owner:ci_owner_pw@localhost:5432/orbit_test
