[alembic]
script_location = migrations
# DB URL은 env.py가 ORBIT_MIGRATION_DATABASE_URL에서 읽는다(소유자 역할).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
