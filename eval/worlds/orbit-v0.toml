# Orbit 평가 세계 모델 v0 (합성 데이터). 실제 인물·주소·회사가 아니다.
# 모든 도메인은 example.com / example.org / .test 이다.
#
# 한계: 두 사용자는 모두 Asia/Seoul이지만 v0 날짜 처리는 UTC 기준이다(Sim 캘린더의 종일 일정이
# UTC 날짜 경계를 쓴다). 그래서 모든 일정은 평일 09:00~18:00(KST)에 두고 종일 일정은 만들지 않는다.

[meta]
dataset_name = "orbit-eval"
dataset_version = "v0"
dev_ratio = 0.6   # D2-3 미결정. 임시값
test_ratio = 0.4

[window]
mail_start = 2026-10-19
snapshot = 2026-11-09T08:00:00+09:00   # 메일함·캘린더 스냅샷 시각 (모든 메일은 이 시각 이전)
event_start = 2026-10-19
event_end = 2026-11-27
asof_start = 2026-11-09                # 과제의 as_of_time 날짜 범위
asof_end = 2026-11-13

[targets]
day_schedule = 10
free_slot = 10
reschedule = 12
cancelled_exclusion = 8
project_week = 10
person_next = 10
newsletters_per_user = 20
spam_per_user = 8
notices_per_user = 6
deadlines = 14
followups = 12

