services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: orbit_spike
      POSTGRES_USER: orbit_spike
      POSTGRES_PASSWORD: ${ORBIT_SPIKE_PG_PASSWORD:-spike}
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit_spike -d orbit_spike"]
      interval: 2s
      timeout: 3s
      retries: 20
